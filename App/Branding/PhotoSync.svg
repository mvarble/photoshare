<?xml version="1.0" encoding="UTF-8"?>
<!-- PhotoSync app icon. 1024×1024 canvas, macOS icon grid (824 px body, 100 px inset). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FA9F5"/>
      <stop offset="1" stop-color="#2346C8"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD37A"/>
      <stop offset="1" stop-color="#FF8A65"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4CD964"/>
      <stop offset="1" stop-color="#1FA84A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B1C5C" flood-opacity="0.35"/>
    </filter>
    <clipPath id="photo">
      <rect x="262" y="286" width="440" height="330" rx="18"/>
    </clipPath>
  </defs>

  <!-- Body -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>

  <!-- Back print, tilted -->
  <g transform="rotate(-9 512 470)" filter="url(#shadow)">
    <rect x="232" y="256" width="500" height="430" rx="30" fill="#DDE7FF"/>
  </g>

  <!-- Front print -->
  <g transform="rotate(4 512 470)" filter="url(#shadow)">
    <rect x="232" y="256" width="500" height="430" rx="30" fill="#FFFFFF"/>
    <g clip-path="url(#photo)">
      <rect x="262" y="286" width="440" height="330" fill="url(#sky)"/>
      <circle cx="600" cy="370" r="46" fill="#FFF4D6"/>
      <path d="M262 616 L262 520 L372 408 L462 500 L520 446 L702 616 Z" fill="#2E7D6B"/>
      <path d="M262 616 L262 560 L340 500 L430 580 L520 520 L620 590 L702 552 L702 616 Z" fill="#1E5A4D"/>
    </g>
  </g>

  <!-- "Added to Photos" badge -->
  <g filter="url(#shadow)">
    <circle cx="712" cy="712" r="126" fill="url(#badge)" stroke="#FFFFFF" stroke-width="18"/>
    <path d="M712 640 L712 770 M656 718 L712 774 L768 718" fill="none" stroke="#FFFFFF"
          stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
